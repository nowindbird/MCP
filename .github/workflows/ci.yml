name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q detector

      - name: 配置自检（验证路径解析）
        run: python detector/config.py > /dev/null

      - name: 依赖接口自检（路径 / 子包导入 / 可选依赖）
        run: python -m detector.deps --check

      - name: 统一入口可用
        run: python -m detector.cli --list

      - name: 单元测试
        # 纯本地用例（fileio / repo_walk / scanner / patterns / align /
        # monitor_parser / sandbox_rules / summary / targets / pipeline / cli / crawler），
        # 不需要网络、LLM 或 Docker。
        run: python -m unittest discover -s detector/tests -v

      - name: 禁止写死用户名路径
        # 曾经因写死 C:\Users\<用户名>\... 导致换机即挂，此处守住不回退
        run: |
          hits=$(grep -rnE "[A-Za-z]:[\\\\/]Users[\\\\/]" detector --include="*.py" || true)
          if [ -n "$hits" ]; then
            echo "发现写死的用户名路径（请改用 config.py + 环境变量）："
            echo "$hits"
            exit 1
          fi
          echo "OK"

      - name: 禁止回退到 sys.path 注入 / 平铺导入
        # 依赖必须统一走 detector.deps；sys.path.insert 会让包结构再次分裂
        run: |
          fail=0
          hits=$(grep -rnE "^[[:space:]]*sys\.path\.(insert|append)" detector --include="*.py" || true)
          if [ -n "$hits" ]; then
            echo "发现 sys.path 注入（请改用包内绝对导入 from detector.xxx import ...）："
            echo "$hits"
            fail=1
          fi
          hits=$(grep -rnE "^[[:space:]]*(from[[:space:]]+(config|align_rate|sandbox_rules|behavior_monitor|docgen|scanner|deps)[[:space:]]+import|import[[:space:]]+(config|align_rate|deps)[[:space:]]*$)" detector --include="*.py" || true)
          if [ -n "$hits" ]; then
            echo "发现平铺导入（请改用 from detector.xxx import ...）："
            echo "$hits"
            fail=1
          fi
          exit $fail

      - name: 禁止混入大文件
        # 只检查「已入库」文件，避免本地被 .gitignore 排除的权重造成误报。
        # 阈值 50MB：GitHub 单文件上限 100MB，留足余量。
        run: |
          hits=$(git ls-files | while read -r f; do
            [ -f "$f" ] || continue
            s=$(wc -c < "$f" | tr -d ' ')
            [ "$s" -gt 52428800 ] && echo "$f ($(( s / 1048576 )) MB)"
          done)
          if [ -n "$hits" ]; then
            echo "发现超过 50MB 的入库文件（模型权重/产物不应入库）："
            echo "$hits"
            exit 1
          fi
          echo "OK"
